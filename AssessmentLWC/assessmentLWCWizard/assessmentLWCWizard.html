<template>
    <lightning-card>
        <lightning-button variant="brand" label="Create Account And Relate Contact" title="Primary action"
            onclick={handleClickAccountManagerWizard} class="slds-m-left_x-small"></lightning-button>
    </lightning-card>
    <template if:true={visible}>
            <div>
              <div class="slds-modal__header">
                <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Account Details</h1>
              </div>
              <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div style="height: 300px;">
                  <lightning-datatable
                          key-field="id"
                          data={data}
                          columns={columns}>
                  </lightning-datatable>
              </div>
              </div>
              <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral first" aria-label="Cancel and close" onclick={hideModel}>Cancel</button>
                <button class="slds-button slds-button_neutral" onclick={ShowCreateFormModel}>Create Contact</button>
              </div>
            </div>

            <lightning-card>
              <lightning-record-edit-form object-api-name={Contact_Object} onsuccess={handleSuccess} onerror={handleError}>
              <lightning-input-field field-name={Name}></lightning-input-field>
              <lightning-input-field field-name={Phone_Number__c}></lightning-input-field>
              <lightning-input-field field-name={Website}></lightning-input-field>
            
              <lightning-button type="submit" variant="brand" label="Save Account" class="slds-align_absolute-center"></lightning-button>
            
          </lightning-record-edit-form>
        </lightning-card>
    </template>

      
</template>
